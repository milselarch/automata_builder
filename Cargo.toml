[package]
name = "automata_builder"
version = "0.1.0"
edition = "2021"
description = "Construction and simulation of 1D cellular automata"

[lib]
name = "automata_builder"
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = "1.11.0"
indent = "0.1.1"
enum-iterator = "2.1.0"
strum = "0.27.2"
strum_macros="0.27.2"
log = "0.4.28"
num-bigint = "0.4.6"
num-traits = "0.2.19"
arbitrary-int = "2.0.0"
pyo3-stub-gen = "0.13.1"
pyo3 = { version = "0.24.0" }
rayon = "1.11.0"
indexmap = "2.11.4"
itertools = "0.13.0"
cartesian = "0.3.0"
struct_macro_eq = "0.1.0"
serde = { version = "1.0.226", features = ["derive"] }

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
